services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: aivo-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    restart: unless-stopped

  aivo-ai:
    container_name: aivo-ai

    gpus: all

    build:
      context: .
      dockerfile: Dockerfile

    image: ${AIVO_AI_IMAGE:-aivo-ai:local}

    ports:
      - "8090:8090"

    depends_on:
      - rabbitmq

    env_file:
      - ../.env
      - .env

    environment:
      TZ: Asia/Seoul
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HF_HOME: /workspace/cache/huggingface
      XDG_CACHE_HOME: /workspace/cache
      RABBITMQ_URL: ${RABBITMQ_DOCKER_URL:-amqp://guest:guest@rabbitmq:5672/}

    volumes:
      - .:/app
      - aivo-cache:/workspace/cache
      - aivo-models:/workspace/models

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --reload

    restart: unless-stopped

  audio-worker:
    image: ${AIVO_AI_IMAGE:-aivo-ai:local}

    gpus: all

    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      - rabbitmq

    env_file:
      - ../.env
      - .env

    environment:
      TZ: Asia/Seoul
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HF_HOME: /workspace/cache/huggingface
      XDG_CACHE_HOME: /workspace/cache
      RABBITMQ_URL: ${RABBITMQ_DOCKER_URL:-amqp://guest:guest@rabbitmq:5672/}

    volumes:
      - .:/app
      - aivo-cache:/workspace/cache
      - aivo-models:/workspace/models

    command:
      - python
      - -m
      - app.workers.audio_worker

    restart: unless-stopped

  llm-worker:
    image: ${AIVO_AI_IMAGE:-aivo-ai:local}

    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      - rabbitmq

    env_file:
      - ../.env
      - .env

    environment:
      TZ: Asia/Seoul
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HF_HOME: /workspace/cache/huggingface
      XDG_CACHE_HOME: /workspace/cache
      RABBITMQ_URL: ${RABBITMQ_DOCKER_URL:-amqp://guest:guest@rabbitmq:5672/}

    volumes:
      - .:/app
      - aivo-cache:/workspace/cache

    command:
      - python
      - -m
      - app.workers.llm_worker

    restart: unless-stopped

volumes:
  aivo-cache:
  aivo-models:
  rabbitmq-data:
