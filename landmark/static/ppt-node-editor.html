<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPT Node Editor</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #64748b;
      --line: #cbd5e1;
      --paper: #f8fafc;
      --panel: #ffffff;
      --green: #2f9e75;
      --orange: #f08c2e;
      --red: #e5484d;
      --blue: #2563eb;
      --shadow: 0 18px 48px rgba(15, 23, 42, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      min-height: 34px;
      border-radius: 8px;
      padding: 0 12px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      border-color: #94a3b8;
      background: #f8fafc;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: 58px minmax(0, 1fr) 54px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 210px;
      font-weight: 900;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      font-weight: 900;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .spacer { flex: 1; }

    .file-button {
      position: relative;
      overflow: hidden;
      background: #eef2ff;
      border-color: #bfdbfe;
      color: #1d4ed8;
    }

    .file-button input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .save-button {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
      min-width: 108px;
    }

    .save-button:hover:not(:disabled) {
      background: #273548;
      border-color: #273548;
    }

    .status-pill {
      max-width: 420px;
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--orange);
      flex: 0 0 auto;
    }

    .dot.ok { background: var(--green); }
    .dot.bad { background: var(--red); }

    .workspace {
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    .viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      background-color: #f8fafc;
      background-image:
        linear-gradient(rgba(100, 116, 139, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100, 116, 139, 0.14) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .viewport:active {
      cursor: grabbing;
    }

    .world {
      position: absolute;
      top: 0;
      left: 0;
      width: 20000px;
      height: 8000px;
      transform-origin: 0 0;
    }

    .edge-svg {
      position: absolute;
      inset: 0;
      width: 20000px;
      height: 8000px;
      pointer-events: auto;
      overflow: visible;
      z-index: 1;
    }

    .edge {
      fill: none;
      stroke: var(--ink);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .edge-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 34;
      pointer-events: stroke;
      cursor: pointer;
    }

    .edge-draft {
      stroke: var(--blue);
      stroke-dasharray: 10 10;
    }

    .edge-cut {
      pointer-events: auto;
      cursor: pointer;
    }

    .edge-cut circle {
      fill: #fff;
      stroke: var(--ink);
      stroke-width: 2;
    }

    .edge-cut text {
      fill: var(--red);
      font: 900 18px Arial, sans-serif;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .nodes {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .node {
      position: absolute;
      width: 276px;
      height: 228px;
      border-radius: 8px;
      background: var(--panel);
      border: 2px solid #1f2937;
      box-shadow: var(--shadow);
      user-select: none;
      overflow: visible;
      cursor: move;
    }

    .node.selected {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.18), var(--shadow);
    }

    .thumb {
      width: 100%;
      height: 154px;
      display: block;
      object-fit: cover;
      border-radius: 6px 6px 0 0;
      background: #e2e8f0;
      border-bottom: 1px solid var(--line);
      pointer-events: none;
    }

    .node-body {
      height: 72px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
    }

    .node-number {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: #e8f5ef;
      color: #1f7a5a;
      font-size: 13px;
      font-weight: 900;
    }

    .node-title {
      min-width: 0;
      font-size: 13px;
      line-height: 1.3;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .node-snippet {
      min-width: 0;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .handle {
      position: absolute;
      top: 77px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid var(--ink);
      background: #fff;
      cursor: crosshair;
      z-index: 5;
    }

    .handle::after {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: 50%;
    }

    .handle.in { left: -16px; }
    .handle.out { right: -16px; background: #dbeafe; }
    .handle:hover { transform: scale(1.12); }

    .empty-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .dropzone {
      width: min(560px, calc(100vw - 48px));
      min-height: 260px;
      display: grid;
      place-items: center;
      gap: 14px;
      padding: 30px;
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
      text-align: center;
      pointer-events: auto;
    }

    .dropzone.dragging {
      border-color: var(--blue);
      background: #eff6ff;
    }

    .drop-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--ink);
      color: #fff;
      font-size: 28px;
      font-weight: 900;
    }

    .drop-title {
      font-size: 20px;
      font-weight: 900;
    }

    .drop-copy {
      max-width: 390px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      font-weight: 700;
    }

    .bottom-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.94);
      border-top: 1px solid var(--line);
      z-index: 20;
    }

    .order-strip {
      min-width: 0;
      display: flex;
      gap: 6px;
      overflow: auto;
      padding-bottom: 2px;
    }

    .order-chip {
      flex: 0 0 auto;
      max-width: 190px;
      height: 30px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 900;
    }

    .order-chip span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .warnings {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .toast {
      position: absolute;
      right: 18px;
      bottom: 72px;
      max-width: 360px;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
      z-index: 30;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 760px) {
      .app {
        grid-template-rows: auto minmax(0, 1fr) auto;
      }

      .topbar {
        flex-wrap: wrap;
      }

      .brand {
        width: 100%;
      }

      .status-pill {
        order: 5;
        width: 100%;
        max-width: none;
      }

      .bottom-bar {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">P</div>
        <div>PPT Node Editor</div>
      </div>
      <div class="toolbar-group">
        <button class="file-button" type="button">
          PPT 업로드
          <input id="fileInput" type="file" accept=".ppt,.pptx">
        </button>
        <button id="fitButton" type="button" disabled>맞춤</button>
        <button id="reflowButton" type="button" disabled>정렬</button>
        <button id="resetButton" type="button" disabled>초기화</button>
      </div>
      <div class="spacer"></div>
      <div id="statusPill" class="status-pill"><span class="dot"></span><span>PPT를 업로드하세요</span></div>
      <button id="saveButton" class="save-button" type="button" disabled>저장</button>
    </header>

    <section class="workspace">
      <div id="viewport" class="viewport">
        <div id="world" class="world">
          <svg id="edgeSvg" class="edge-svg"></svg>
          <div id="nodes" class="nodes"></div>
        </div>
      </div>

      <div id="emptyState" class="empty-state">
        <label id="dropzone" class="dropzone">
          <input id="dropInput" type="file" accept=".ppt,.pptx" hidden>
          <div class="drop-icon">+</div>
          <div>
            <div class="drop-title">PPT를 캔버스로 열기</div>
            <div class="drop-copy">슬라이드가 순서대로 노드가 되고, 연결선을 끊거나 다시 이어 저장 순서를 바꿀 수 있습니다.</div>
          </div>
        </label>
      </div>

      <div id="toast" class="toast"></div>
    </section>

    <footer class="bottom-bar">
      <div id="orderStrip" class="order-strip"></div>
      <div id="warningText" class="warnings">원본은 저장 버튼을 누를 때까지 바뀌지 않습니다</div>
    </footer>
  </main>

  <script>
    const NODE_W = 276;
    const NODE_H = 228;
    const WORLD_W = 20000;
    const WORLD_H = 8000;

    const state = {
      presentation: null,
      slides: [],
      nodes: new Map(),
      edges: new Map(),
      view: { x: 90, y: 90, scale: 0.92 },
      pan: null,
      drag: null,
      linkDraft: null,
      selected: null,
      busy: false
    };

    const els = {
      fileInput: document.getElementById("fileInput"),
      dropInput: document.getElementById("dropInput"),
      dropzone: document.getElementById("dropzone"),
      emptyState: document.getElementById("emptyState"),
      viewport: document.getElementById("viewport"),
      world: document.getElementById("world"),
      edgeSvg: document.getElementById("edgeSvg"),
      nodes: document.getElementById("nodes"),
      statusPill: document.getElementById("statusPill"),
      saveButton: document.getElementById("saveButton"),
      fitButton: document.getElementById("fitButton"),
      reflowButton: document.getElementById("reflowButton"),
      resetButton: document.getElementById("resetButton"),
      orderStrip: document.getElementById("orderStrip"),
      warningText: document.getElementById("warningText"),
      toast: document.getElementById("toast")
    };

    els.edgeSvg.setAttribute("width", WORLD_W);
    els.edgeSvg.setAttribute("height", WORLD_H);

    els.fileInput.addEventListener("change", event => {
      const file = event.target.files[0];
      if (file) uploadFile(file);
      event.target.value = "";
    });

    els.dropInput.addEventListener("change", event => {
      const file = event.target.files[0];
      if (file) uploadFile(file);
      event.target.value = "";
    });

    els.dropzone.addEventListener("click", () => els.dropInput.click());
    els.dropzone.addEventListener("dragover", event => {
      event.preventDefault();
      els.dropzone.classList.add("dragging");
    });
    els.dropzone.addEventListener("dragleave", () => els.dropzone.classList.remove("dragging"));
    els.dropzone.addEventListener("drop", event => {
      event.preventDefault();
      els.dropzone.classList.remove("dragging");
      const file = event.dataTransfer.files[0];
      if (file) uploadFile(file);
    });

    els.viewport.addEventListener("pointerdown", event => {
      if (event.button !== 0 || state.drag || state.linkDraft) return;
      const canPan = event.target === els.viewport || event.target === els.world || event.target === els.edgeSvg;
      if (!canPan) return;
      state.pan = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        viewX: state.view.x,
        viewY: state.view.y
      };
      els.viewport.setPointerCapture(event.pointerId);
    });

    els.viewport.addEventListener("wheel", event => {
      event.preventDefault();
      const before = screenToWorld(event.clientX, event.clientY);
      const delta = event.deltaY > 0 ? 0.9 : 1.1;
      state.view.scale = clamp(state.view.scale * delta, 0.22, 1.7);
      const rect = els.viewport.getBoundingClientRect();
      state.view.x = event.clientX - rect.left - before.x * state.view.scale;
      state.view.y = event.clientY - rect.top - before.y * state.view.scale;
      applyView();
    }, { passive: false });

    window.addEventListener("pointermove", event => {
      if (state.pan) {
        state.view.x = state.pan.viewX + event.clientX - state.pan.startX;
        state.view.y = state.pan.viewY + event.clientY - state.pan.startY;
        applyView();
      }

      if (state.drag) {
        const point = screenToWorld(event.clientX, event.clientY);
        const node = state.nodes.get(state.drag.uid);
        node.x = point.x - state.drag.offsetX;
        node.y = point.y - state.drag.offsetY;
        renderNodes();
        renderEdges();
      }

      if (state.linkDraft) {
        state.linkDraft.to = screenToWorld(event.clientX, event.clientY);
        renderEdges();
      }
    });

    window.addEventListener("pointerup", event => {
      if (state.linkDraft) {
        const target = document.elementFromPoint(event.clientX, event.clientY);
        const handle = target ? target.closest(".handle.in") : null;
        const targetUid = handle ? handle.dataset.uid : findNearestInputHandle(event.clientX, event.clientY);
        if (targetUid) {
          connect(state.linkDraft.from, targetUid);
        } else {
          showToast("연결할 노드의 왼쪽 동그라미에 놓아주세요.");
        }
        state.linkDraft = null;
        renderAll();
      }

      state.drag = null;
      state.pan = null;
    });

    els.fitButton.addEventListener("click", fitView);
    els.reflowButton.addEventListener("click", () => {
      layoutByOrder(computeVisualOrder());
      fitView();
      renderAll();
    });
    els.resetButton.addEventListener("click", () => {
      resetEdges();
      layoutByOrder(state.slides.map(slide => slide.uid));
      fitView();
      renderAll();
    });
    els.saveButton.addEventListener("click", savePresentation);

    applyView();
    renderAll();

    async function uploadFile(file) {
      if (!/\.(pptx|ppt)$/i.test(file.name)) {
        showToast("PPT 또는 PPTX 파일만 업로드할 수 있습니다.");
        return;
      }

      setBusy(true);
      setStatus("업로드 중...", "warn");
      try {
        const form = new FormData();
        form.append("file", file);
        const response = await fetch("/api/presentations", { method: "POST", body: form });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "업로드에 실패했습니다.");

        loadPresentation(payload);
        showToast("슬라이드 노드가 열렸습니다.");
      } catch (error) {
        setStatus("업로드 실패", "bad");
        showToast(error.message);
      } finally {
        setBusy(false);
      }
    }

    function loadPresentation(payload) {
      state.presentation = payload;
      state.slides = payload.slides || [];
      state.nodes = new Map();
      state.edges = new Map();
      state.selected = null;
      layoutByOrder(state.slides.map(slide => slide.uid));
      resetEdges();
      els.emptyState.style.display = state.slides.length ? "none" : "grid";
      els.fitButton.disabled = !state.slides.length;
      els.reflowButton.disabled = !state.slides.length;
      els.resetButton.disabled = !state.slides.length;
      renderAll();
      requestAnimationFrame(fitView);

      const warningCount = (payload.warnings || []).length;
      const renderer = payload.renderer === "svg-fallback" ? "구조 미리보기" : "실제 슬라이드 이미지";
      const ocr = payload.ocr && payload.ocr !== "disabled" ? payload.ocr : "OCR 비활성";
      els.warningText.textContent = warningCount
        ? `${renderer} · ${ocr} · 경고 ${warningCount}개`
        : `${renderer} · ${ocr}`;
    }

    function layoutByOrder(order) {
      order.forEach((uid, index) => {
        state.nodes.set(uid, {
          uid,
          x: 90 + index * 356,
          y: 170
        });
      });
    }

    function resetEdges() {
      state.edges = new Map();
      for (let index = 0; index < state.slides.length - 1; index += 1) {
        state.edges.set(state.slides[index].uid, state.slides[index + 1].uid);
      }
    }

    function renderAll() {
      renderNodes();
      renderEdges();
      renderOrder();
      updateSaveState();
    }

    function renderNodes() {
      els.nodes.innerHTML = "";
      for (const slide of state.slides) {
        const node = state.nodes.get(slide.uid);
        if (!node) continue;

        const el = document.createElement("article");
        el.className = "node" + (state.selected === slide.uid ? " selected" : "");
        el.style.transform = `translate(${node.x}px, ${node.y}px)`;
        el.dataset.uid = slide.uid;
        el.innerHTML = `
          <img class="thumb" src="${escapeAttribute(slide.preview_url)}" alt="">
          <div class="node-body">
            <div class="node-number">${slide.number}</div>
            <div>
              <div class="node-title">${escapeHtml(slide.title || "Untitled")}</div>
              <div class="node-snippet">${escapeHtml(slide.ocr_text || slide.snippet || "텍스트 없음")}</div>
            </div>
          </div>
          <div class="handle in" data-uid="${escapeAttribute(slide.uid)}" title="이전 슬라이드 연결"></div>
          <div class="handle out" data-uid="${escapeAttribute(slide.uid)}" title="다음 슬라이드 연결"></div>
        `;

        el.addEventListener("pointerdown", event => {
          if (event.button !== 0 || event.target.classList.contains("handle")) return;
          event.stopPropagation();
          state.selected = slide.uid;
          const point = screenToWorld(event.clientX, event.clientY);
          state.drag = {
            uid: slide.uid,
            offsetX: point.x - node.x,
            offsetY: point.y - node.y
          };
          renderNodes();
        });

        el.querySelector(".handle.out").addEventListener("pointerdown", event => {
          event.stopPropagation();
          const from = event.currentTarget.dataset.uid;
          state.linkDraft = {
            from,
            fromPoint: connectorPoint(from, "out"),
            to: screenToWorld(event.clientX, event.clientY)
          };
          renderEdges();
        });

        els.nodes.appendChild(el);
      }
    }

    function renderEdges() {
      els.edgeSvg.innerHTML = "";
      for (const [from, to] of state.edges.entries()) {
        drawEdge(from, to);
      }

      if (state.linkDraft) {
        const from = state.linkDraft.fromPoint;
        const to = state.linkDraft.to;
        const path = createSvg("path");
        path.setAttribute("class", "edge edge-draft");
        path.setAttribute("d", edgePath(from, to));
        els.edgeSvg.appendChild(path);
      }
    }

    function drawEdge(fromUid, toUid) {
      const from = connectorPoint(fromUid, "out");
      const to = connectorPoint(toUid, "in");
      const d = edgePath(from, to);

      const path = createSvg("path");
      path.setAttribute("class", "edge");
      path.setAttribute("d", d);
      els.edgeSvg.appendChild(path);

      const hit = createSvg("path");
      hit.setAttribute("class", "edge-hit");
      hit.setAttribute("d", d);
      hit.addEventListener("click", event => {
        event.stopPropagation();
        state.edges.delete(fromUid);
        renderAll();
      });
      els.edgeSvg.appendChild(hit);

      const cut = createSvg("g");
      cut.setAttribute("class", "edge-cut");
      const mid = { x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 };
      cut.setAttribute("transform", `translate(${mid.x} ${mid.y})`);
      const circle = createSvg("circle");
      circle.setAttribute("r", "18");
      const label = createSvg("text");
      label.setAttribute("y", "1");
      label.textContent = "×";
      cut.appendChild(circle);
      cut.appendChild(label);
      cut.addEventListener("click", event => {
        event.stopPropagation();
        state.edges.delete(fromUid);
        renderAll();
      });
      els.edgeSvg.appendChild(cut);
    }

    function connectorPoint(uid, side) {
      const node = state.nodes.get(uid);
      if (!node) return { x: 0, y: 0 };
      return {
        x: side === "out" ? node.x + NODE_W : node.x,
        y: node.y + 91
      };
    }

    function findNearestInputHandle(clientX, clientY) {
      const point = screenToWorld(clientX, clientY);
      let nearest = null;
      let nearestDistance = 46;

      for (const slide of state.slides) {
        const center = connectorPoint(slide.uid, "in");
        const distance = Math.hypot(point.x - center.x, point.y - center.y);
        if (distance < nearestDistance) {
          nearest = slide.uid;
          nearestDistance = distance;
        }
      }

      return nearest;
    }

    function edgePath(from, to) {
      const distance = Math.max(90, Math.abs(to.x - from.x) * 0.45);
      return `M ${from.x} ${from.y} C ${from.x + distance} ${from.y}, ${to.x - distance} ${to.y}, ${to.x} ${to.y}`;
    }

    function connect(from, to) {
      if (!from || !to || from === to) {
        showToast("같은 슬라이드끼리는 연결할 수 없습니다.");
        return;
      }

      if (wouldCreateCycle(from, to)) {
        showToast("순환 연결은 만들 수 없습니다.");
        return;
      }

      state.edges.delete(from);
      for (const [source, target] of Array.from(state.edges.entries())) {
        if (target === to) state.edges.delete(source);
      }
      state.edges.set(from, to);
    }

    function wouldCreateCycle(from, to) {
      let cursor = to;
      const seen = new Set();
      while (cursor && !seen.has(cursor)) {
        if (cursor === from) return true;
        seen.add(cursor);
        cursor = state.edges.get(cursor);
      }
      return false;
    }

    function renderOrder() {
      const order = computeVisualOrder();
      els.orderStrip.innerHTML = "";
      for (const uid of order) {
        const slide = state.slides.find(item => item.uid === uid);
        if (!slide) continue;
        const chip = document.createElement("div");
        chip.className = "order-chip";
        chip.innerHTML = `<span>${slide.number}</span><span>${escapeHtml(slide.title || "Untitled")}</span>`;
        els.orderStrip.appendChild(chip);
      }
    }

    function updateSaveState() {
      const result = computeSaveOrder();
      els.saveButton.disabled = state.busy || !result.valid;
      if (!state.slides.length) {
        setStatus("PPT를 업로드하세요", "warn");
      } else if (result.valid) {
        setStatus(`${state.slides.length}개 슬라이드 · 저장 가능`, "ok");
      } else {
        setStatus(result.reason, "bad");
      }
    }

    function computeSaveOrder() {
      if (!state.slides.length) {
        return { valid: false, order: [], reason: "PPT를 업로드하세요" };
      }

      if (state.edges.size !== state.slides.length - 1) {
        const missing = state.slides.length - 1 - state.edges.size;
        return { valid: false, order: [], reason: `연결 ${Math.max(0, missing)}개가 더 필요합니다` };
      }

      const incoming = incomingMap();
      const starts = state.slides.map(slide => slide.uid).filter(uid => !incoming.has(uid));
      if (starts.length !== 1) {
        return { valid: false, order: [], reason: "시작 노드가 하나여야 합니다" };
      }

      const order = [];
      const seen = new Set();
      let cursor = starts[0];
      while (cursor && !seen.has(cursor)) {
        order.push(cursor);
        seen.add(cursor);
        cursor = state.edges.get(cursor);
      }

      if (order.length !== state.slides.length) {
        return { valid: false, order: [], reason: "모든 노드가 하나의 선으로 이어져야 합니다" };
      }

      return { valid: true, order, reason: "" };
    }

    function computeVisualOrder() {
      const incoming = incomingMap();
      const all = state.slides.map(slide => slide.uid);
      const starts = all
        .filter(uid => !incoming.has(uid))
        .sort((a, b) => (state.nodes.get(a)?.x || 0) - (state.nodes.get(b)?.x || 0));
      const order = [];
      const seen = new Set();

      for (const start of starts) {
        let cursor = start;
        while (cursor && !seen.has(cursor)) {
          order.push(cursor);
          seen.add(cursor);
          cursor = state.edges.get(cursor);
        }
      }

      for (const uid of all.sort((a, b) => (state.nodes.get(a)?.x || 0) - (state.nodes.get(b)?.x || 0))) {
        if (!seen.has(uid)) order.push(uid);
      }

      return order;
    }

    function incomingMap() {
      const incoming = new Map();
      for (const [from, to] of state.edges.entries()) {
        incoming.set(to, from);
      }
      return incoming;
    }

    async function savePresentation() {
      const result = computeSaveOrder();
      if (!result.valid || !state.presentation) return;

      setBusy(true);
      setStatus("저장 중...", "warn");
      try {
        const response = await fetch(`/api/presentations/${state.presentation.id}/save`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ order: result.order })
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "저장에 실패했습니다.");
        const link = document.createElement("a");
        link.href = payload.download_url;
        link.download = payload.filename || "";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setStatus("저장 완료", "ok");
        showToast("재정렬된 PPTX를 만들었습니다.");
      } catch (error) {
        setStatus("저장 실패", "bad");
        showToast(error.message);
      } finally {
        setBusy(false);
        updateSaveState();
      }
    }

    function fitView() {
      if (!state.slides.length) return;
      const nodes = [...state.nodes.values()];
      const minX = Math.min(...nodes.map(node => node.x));
      const minY = Math.min(...nodes.map(node => node.y));
      const maxX = Math.max(...nodes.map(node => node.x + NODE_W));
      const maxY = Math.max(...nodes.map(node => node.y + NODE_H));
      const width = Math.max(1, maxX - minX);
      const height = Math.max(1, maxY - minY);
      const rect = els.viewport.getBoundingClientRect();
      const scale = clamp(Math.min((rect.width - 120) / width, (rect.height - 120) / height), 0.24, 1.08);
      state.view.scale = scale;
      state.view.x = (rect.width - width * scale) / 2 - minX * scale;
      state.view.y = (rect.height - height * scale) / 2 - minY * scale;
      applyView();
    }

    function applyView() {
      els.world.style.transform = `translate(${state.view.x}px, ${state.view.y}px) scale(${state.view.scale})`;
    }

    function screenToWorld(clientX, clientY) {
      const rect = els.viewport.getBoundingClientRect();
      return {
        x: (clientX - rect.left - state.view.x) / state.view.scale,
        y: (clientY - rect.top - state.view.y) / state.view.scale
      };
    }

    function setBusy(value) {
      state.busy = value;
      els.fileInput.disabled = value;
      els.dropInput.disabled = value;
      els.saveButton.disabled = value || els.saveButton.disabled;
      els.fitButton.disabled = value || !state.slides.length;
      els.reflowButton.disabled = value || !state.slides.length;
      els.resetButton.disabled = value || !state.slides.length;
    }

    function setStatus(text, tone) {
      const dot = els.statusPill.querySelector(".dot");
      dot.className = "dot";
      if (tone === "ok") dot.classList.add("ok");
      if (tone === "bad") dot.classList.add("bad");
      els.statusPill.querySelector("span:last-child").textContent = text;
    }

    let toastTimer = null;
    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 2800);
    }

    function createSvg(tag) {
      return document.createElementNS("http://www.w3.org/2000/svg", tag);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }
  </script>
</body>
</html>
