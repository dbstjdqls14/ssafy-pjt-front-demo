<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIVO Scene 4</title>
  <style>
    @font-face { font-family: Malgun; src: url('/fonts/malgun.ttf'); }
    @font-face { font-family: Malgun; src: url('/fonts/malgunbd.ttf'); font-weight: 700; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07111f; }
    body { font-family: Malgun, Arial, sans-serif; color: #fff; }
    #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #07111f; transform-origin: left top; }
    .panel { position: absolute; top: 0; width: 50%; height: 100%; overflow: hidden; }
    .left { left: 0; background: radial-gradient(circle at 50% 38%, #164c72 0%, #09233b 48%, #061323 100%); }
    .right { right: 0; background: #12282d; }
    .photo-bg { position: absolute; inset: -35px; width: calc(100% + 70px); height: calc(100% + 70px); object-fit: cover; filter: blur(25px) saturate(.85); opacity: .28; transform: scale(1.08); }
    .woman-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; transform: scale(var(--rightZoom)); }
    .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,15,28,.12), rgba(4,15,28,.18) 42%, rgba(4,15,28,.78)); }
    .left .shade { background: linear-gradient(180deg, rgba(5,22,38,.05), rgba(5,18,31,.30) 55%, rgba(3,10,20,.90)); }
    .panel-focus { position: absolute; inset: 0; background: #03101e; pointer-events: none; opacity: var(--leftDim); }
    .right .panel-focus { opacity: var(--rightDim); }
    .webcam { position: absolute; left: 150px; top: 170px; width: 660px; height: 590px; border-radius: 34px; overflow: hidden; background: rgba(9,26,44,.86); border: 2px solid rgba(85,213,255,.42); box-shadow: 0 25px 80px rgba(0,0,0,.36), inset 0 0 60px rgba(66,203,255,.07); transform: scale(var(--leftZoom)); }
    .webcam .portrait-blur { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(28px); opacity: .30; transform: scale(1.25); }
    .webcam .portrait { position: absolute; width: 438px; height: 438px; left: 111px; top: 75px; object-fit: cover; border-radius: 26px; image-rendering: auto; box-shadow: 0 18px 48px rgba(0,0,0,.25); }
    .webcam-top { position: absolute; left: 24px; right: 24px; top: 20px; display: flex; justify-content: space-between; font-size: 20px; color: #cbefff; }
    .live { display: flex; align-items: center; gap: 9px; font-weight: 700; }
    .live-dot { width: 11px; height: 11px; border-radius: 50%; background: #34f5aa; box-shadow: 0 0 16px #34f5aa; }
    .mode { position: absolute; left: 54px; top: 48px; z-index: 8; display: flex; align-items: center; gap: 18px; }
    .mode-icon { width: 54px; height: 54px; border-radius: 17px; display: grid; place-items: center; background: rgba(43,199,255,.18); border: 1px solid rgba(109,224,255,.50); color: #62ddff; font-size: 28px; }
    .mode small { display: block; color: #82cce4; letter-spacing: 2px; font-size: 15px; margin-bottom: 2px; }
    .mode strong { font-size: 29px; letter-spacing: -.6px; }
    .right .mode { left: 48px; }
    .right .mode-icon { background: rgba(97,255,188,.16); border-color: rgba(125,255,198,.44); color: #7cffc2; }
    .face-track { position: absolute; left: 317px; top: 322px; width: 326px; height: 245px; border: 3px solid #49f5b4; border-radius: 26px; opacity: var(--trackOpacity); transform: scale(var(--trackScale)); box-shadow: 0 0 32px rgba(73,245,180,.20); }
    .face-track::before, .face-track::after { content: ''; position: absolute; top: 48%; width: 42px; height: 2px; background: #49f5b4; box-shadow: 0 0 9px #49f5b4; }
    .face-track::before { left: -23px; } .face-track::after { right: -23px; }
    .eye-line { position: absolute; left: 48px; top: 102px; width: 225px; height: 2px; background: linear-gradient(90deg, transparent, #49f5b4, transparent); }
    .track-label { position: absolute; left: 0; top: -45px; padding: 10px 16px; border-radius: 12px; background: #29d590; color: #032319; font-size: 18px; font-weight: 700; }
    .speed-card { position: absolute; left: 72px; bottom: 78px; width: 820px; height: 190px; border-radius: 26px; padding: 26px 30px; background: rgba(5,21,37,.86); border: 1px solid rgba(103,218,255,.30); box-shadow: 0 18px 50px rgba(0,0,0,.22); opacity: var(--speedOpacity); transform: translateY(var(--speedY)); }
    .card-head { display: flex; justify-content: space-between; align-items: center; }
    .card-title { color: #c9eafa; font-size: 20px; }
    .metric { font-size: 28px; font-weight: 700; color: #6dffbd; }
    .meter { position: relative; margin-top: 25px; height: 20px; border-radius: 999px; background: linear-gradient(90deg, #ffcf5c 0 22%, #42e59c 22% 78%, #ff7b78 78%); overflow: visible; }
    .meter::after { content: '적정 속도'; position: absolute; left: 50%; top: 35px; transform: translateX(-50%); color: #8fc5d7; font-size: 16px; }
    .needle { position: absolute; top: -11px; left: var(--needle); width: 8px; height: 42px; border-radius: 8px; background: #fff; box-shadow: 0 0 16px #fff; transform: translateX(-50%); }
    .stability { position: absolute; right: 66px; top: 158px; padding: 18px 24px; border-radius: 18px; background: rgba(3,39,31,.88); border: 1px solid rgba(80,255,190,.45); opacity: var(--stableOpacity); transform: translateY(var(--stableY)); }
    .stability b { color: #5dffba; font-size: 27px; } .stability span { color: #c8e8db; font-size: 18px; margin-left: 10px; }
    .pose-line { position: absolute; left: 594px; top: 278px; height: 415px; width: 3px; background: linear-gradient(#6effbd, #42d8ff); box-shadow: 0 0 15px #62ffbd; opacity: var(--poseOpacity); transform: rotate(-1.5deg); transform-origin: top; }
    .pose-line::before, .pose-line::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); width: 176px; height: 3px; background: #6effbd; box-shadow: 0 0 12px #6effbd; }
    .pose-line::before { top: 116px; } .pose-line::after { top: 260px; width: 135px; }
    .joint { position: absolute; left: 50%; transform: translate(-50%,-50%); width: 17px; height: 17px; border: 3px solid #fff; background: #41dda4; border-radius: 50%; box-shadow: 0 0 14px #51eeb2; }
    .joint.j1 { top: 0; } .joint.j2 { top: 116px; } .joint.j3 { top: 260px; } .joint.j4 { top: 410px; }
    .pose-badge { position: absolute; right: 48px; top: 166px; width: 270px; padding: 22px 24px; border-radius: 22px; background: rgba(4,44,35,.88); border: 1px solid rgba(109,255,194,.50); opacity: var(--poseBadgeOpacity); transform: translateY(var(--poseBadgeY)); }
    .pose-badge small { color: #a4d6c3; font-size: 17px; } .pose-badge strong { display: block; color: #68ffbb; font-size: 31px; margin-top: 4px; }
    .filler { position: absolute; right: 46px; bottom: 120px; width: 330px; height: 160px; border-radius: 24px; padding: 22px 26px; background: rgba(6,24,36,.88); border: 1px solid rgba(97,221,255,.38); box-shadow: 0 18px 50px rgba(0,0,0,.25); opacity: var(--fillerOpacity); transform: translateX(var(--fillerX)); }
    .filler span { color: #bfe9f2; font-size: 20px; } .filler strong { display: block; font-size: 57px; color: #70ffc1; margin-top: 5px; }
    .scan { position: absolute; top: 110px; bottom: 60px; width: 4px; left: var(--scanX); background: linear-gradient(transparent, #63efff 15%, #63efff 85%, transparent); box-shadow: 0 0 28px #4cecff; opacity: var(--scanOpacity); }
    .divider { position: absolute; z-index: 20; left: calc(50% - 2px); top: 0; width: 4px; height: 100%; background: linear-gradient(transparent, #48dcff 14%, #76ffc0 50%, #48dcff 86%, transparent); box-shadow: 0 0 24px rgba(78,225,255,.8); opacity: var(--dividerOpacity); }
    .brand { position: absolute; z-index: 24; top: 42px; left: 50%; transform: translateX(-50%); padding: 12px 22px; border-radius: 18px; background: rgba(4,19,33,.88); border: 1px solid rgba(101,222,255,.38); box-shadow: 0 12px 35px rgba(0,0,0,.22); font-weight: 700; font-size: 29px; letter-spacing: 4px; }
    .brand i { font-style: normal; color: #5ce7ff; } .brand span { color: #74ffc0; }
    .progress { position: absolute; z-index: 25; left: 54px; right: 54px; bottom: 30px; height: 6px; border-radius: 99px; background: rgba(255,255,255,.16); overflow: hidden; }
    .progress::after { content: ''; display: block; height: 100%; width: var(--progress); background: linear-gradient(90deg,#43dfff,#63ffb8); box-shadow: 0 0 16px #5eeecf; }
    .final { position: absolute; z-index: 40; left: 50%; top: 50%; width: 820px; height: 330px; transform: translate(-50%,-50%) scale(var(--finalScale)); border-radius: 40px; background: linear-gradient(145deg, rgba(7,28,47,.96), rgba(6,45,39,.96)); border: 2px solid rgba(120,255,210,.62); box-shadow: 0 34px 120px rgba(0,0,0,.52), 0 0 60px rgba(79,242,193,.15); display: grid; place-items: center; text-align: center; opacity: var(--finalOpacity); }
    .final .check { width: 78px; height: 78px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; background: #5bffb7; color: #063225; font-size: 48px; font-weight: 700; box-shadow: 0 0 34px rgba(91,255,183,.46); }
    .final strong { display: block; font-size: 46px; letter-spacing: -1px; }
    .final p { margin: 14px 0 0; color: #b8dce5; font-size: 22px; }
    .intro-cover { position: absolute; z-index: 60; inset: 0; background: #07111f; opacity: var(--introCover); pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage">
    <section class="panel left">
      <img class="photo-bg" src="/assets/seunggyu.png" alt="" />
      <div class="shade"></div>
      <div class="mode"><div class="mode-icon">◎</div><div><small>AIVO PRACTICE</small><strong>면접 집중 모드</strong></div></div>
      <div class="webcam">
        <img class="portrait-blur" src="/assets/seunggyu.png" alt="" />
        <img class="portrait" src="/assets/seunggyu.png" alt="승규" />
        <div class="webcam-top"><span class="live"><i class="live-dot"></i> LIVE 분석</span><span>00:07</span></div>
      </div>
      <div class="face-track"><div class="eye-line"></div><div class="track-label">시선 고정</div></div>
      <div class="stability"><b>96%</b><span>시선 안정도</span></div>
      <div class="speed-card"><div class="card-head"><span class="card-title">말하기 속도 페이스메이커</span><span class="metric">318자/분</span></div><div class="meter"><i class="needle"></i></div></div>
      <div class="scan"></div>
      <div class="panel-focus"></div>
    </section>
    <section class="panel right">
      <img class="woman-photo" src="/assets/hyunju.png" alt="현주" />
      <div class="shade"></div>
      <div class="mode"><div class="mode-icon">◇</div><div><small>AIVO PRACTICE</small><strong>발표 코칭 모드</strong></div></div>
      <div class="pose-line"><i class="joint j1"></i><i class="joint j2"></i><i class="joint j3"></i><i class="joint j4"></i></div>
      <div class="pose-badge"><small>실시간 자세 분석</small><strong>바른 자세 ✓</strong></div>
      <div class="filler"><span>필러 워드 감지</span><strong>0회</strong></div>
      <div class="panel-focus"></div>
    </section>
    <div class="divider"></div>
    <div class="brand"><i>AI</i><span>VO</span></div>
    <div class="progress"></div>
    <div class="final"><div><div class="check">✓</div><strong>오늘의 연습 분석 완료</strong><p>시선 · 말하기 속도 · 자세 · 필러 워드가 모두 안정적이에요</p></div></div>
    <div class="intro-cover"></div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const t = Math.max(0, Math.min(10, Number(q.get('t') || 0)));
    const root = document.documentElement;
    const stage = document.getElementById('stage');
    const fit = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `scale(${fit})`;
    const clamp = v => Math.max(0, Math.min(1, v));
    const smooth = (a,b,x) => { const n=clamp((x-a)/(b-a)); return n*n*(3-2*n); };
    const leftActive = 1 - smooth(4.5,5.5,t);
    const rightActive = smooth(4.5,5.5,t);
    const finalIn = smooth(8.75,9.25,t);
    const intro = smooth(0,.55,t);
    const set = (k,v) => root.style.setProperty(k,v);
    set('--introCover', 1-intro);
    set('--dividerOpacity', .35 + .65*intro);
    set('--progress', `${t*10}%`);
    set('--leftZoom', 1 + .035*leftActive);
    set('--rightZoom', 1.02 + .035*rightActive);
    set('--leftDim', .34*rightActive + .30*finalIn);
    set('--rightDim', .30*leftActive + .30*finalIn);
    const track = smooth(.65,1.2,t)*(1-finalIn);
    set('--trackOpacity', track);
    set('--trackScale', .92 + .08*track);
    const speed = smooth(1.45,2.05,t)*(1-finalIn);
    set('--speedOpacity', speed);
    set('--speedY', `${(1-speed)*45}px`);
    set('--needle', `${45 + Math.sin(t*4.8)*3.5}%`);
    const stable = smooth(2.45,2.95,t)*(1-finalIn);
    set('--stableOpacity', stable);
    set('--stableY', `${(1-stable)*-20}px`);
    set('--scanOpacity', (t>.4 && t<4.8 ? .7 : 0)*(1-finalIn));
    set('--scanX', `${100 + ((t*.62)%1)*760}px`);
    const pose = smooth(4.75,5.45,t)*(1-finalIn);
    set('--poseOpacity', pose);
    const poseBadge = smooth(5.6,6.15,t)*(1-finalIn);
    set('--poseBadgeOpacity', poseBadge);
    set('--poseBadgeY', `${(1-poseBadge)*-26}px`);
    const filler = smooth(6.65,7.25,t)*(1-finalIn);
    set('--fillerOpacity', filler);
    set('--fillerX', `${(1-filler)*45}px`);
    set('--finalOpacity', finalIn);
    set('--finalScale', .88 + .12*finalIn);
  </script>
</body>
</html>
